[package]
name = "orbital-forge"
version = "0.1.0"
edition = "2021"
authors = ["ZengLLQ"]
description = "High-Performance Molecular Electronic Structure, Restricted Hartree-Fock (RHF) & Density Functional Theory (DFT) Engine in Rust"
license = "MIT"
repository = "https://github.com/ZengLLQ/orbital-forge"
keywords = ["quantum-chemistry", "hartree-fock", "dft", "electronic-structure", "computational-chemistry"]
categories = ["science"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[lib]
name = "orbital_forge"
path = "src/lib.rs"

[[bin]]
name = "orbital-forge"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
